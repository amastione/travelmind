<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        html, body {
            margin: 0;
            background: transparent;
            color: #ffffff;
            font-family: system-ui, sans-serif;
        }

        .field {
            padding: 5px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #536078;
            border-radius: 12px;
            outline: none;
            background: #0b1322;
            color: #ffffff;
            font-size: 16px;
        }

        input:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 0 2px #22d3ee33;
        }

        input::placeholder {
            color: #94a3b8;
        }

        #status {
            margin-top: 8px;
            color: #67e8f9;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="field">
        <label for="destination">Куда отправляемся?</label>

        <input
            id="destination"
            type="text"
            autocomplete="off"
            placeholder="Введите название места"
        >

        <div id="status">HTML загружен. Ожидаем JavaScript…</div>
    </div>

    <script>
        const field = document.getElementById("destination");
        const status = document.getElementById("status");

        let initialized = false;
        let timer = null;
        let sequence = 0;
        let lastSent = "";

        const instanceId =
            Date.now().toString(36) + "-" +
            Math.random().toString(36).slice(2);

        function send(type, payload) {
            window.parent.postMessage(
                Object.assign(
                    {
                        isStreamlitMessage: true,
                        type: type
                    },
                    payload || {}
                ),
                "*"
            );
        }

        function publish() {
            clearTimeout(timer);

            if (!initialized || field.value === lastSent) {
                return;
            }

            lastSent = field.value;
            sequence += 1;

            send("streamlit:setComponentValue", {
                dataType: "json",
                value: {
                    id: instanceId + "-" + sequence,
                    type: "input",
                    value: field.value
                }
            });

            status.textContent = "Текст отправлен в приложение";
        }

        window.addEventListener("message", function(event) {
            if (event.source !== window.parent) {
                return;
            }

            const message = event.data;

            if (!message || message.type !== "streamlit:render") {
                return;
            }

            if (!initialized) {
                const args = message.args || {};
                field.value = String(args.value || "");
                lastSent = field.value;
                initialized = true;
            }
